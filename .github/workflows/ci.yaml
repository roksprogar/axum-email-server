name: Rust CI

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Build the sqlx macros against the committed .sqlx cache, not a live DB.
  SQLX_OFFLINE: "true"

jobs:
  test:
    name: Test Library
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mailtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: .

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Run tests
      run: cargo test --all-features
      env:
        # Runtime connection for the Postgres integration test; the schema is
        # created by the test itself.
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/mailtest
