[package]
name = "axum-email-server"
version = "0.3.0"
edition = "2021"
description = "A framework-agnostic Rust library for receiving and replying to SMTP mail via a pluggable store."
license = "MIT"
repository = "https://github.com/roksprogar/axum-email-server"
documentation = "https://docs.rs/axum-email-server"
readme = "README.md"
keywords = ["smtp", "email", "mail", "server", "rust"]
categories = ["email", "network-programming"]
include = ["src/**/*", ".sqlx/**/*", "LICENSE", "README.md", "tests/**/*"]

[dependencies]
tokio = { version = "1.42", features = ["full"] }
thiserror = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
mail-parser = { version = "0.11", features = ["full_encoding"] }
mail-auth = "0.11"
tokio-rustls = "0.26"
rustls-pemfile = "2.2"
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls", "builder"] }
uuid = { version = "1", features = ["v4"] }
reqwest = "0.12"
serde_json = "1.0"

# Optional Axum support
axum = { version = "0.7", optional = true }
tower = { version = "0.4", optional = true, features = ["util"] }
tower-http = { version = "0.5", optional = true }

# Optional Postgres storage backend (mirrors axum-email-otp-auth's RedisStorage)
sqlx = { version = "0.8", optional = true, features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
] }

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"

[features]
default = []
axum = ["dep:axum", "dep:tower", "dep:tower-http"]
postgres = ["dep:sqlx"]
